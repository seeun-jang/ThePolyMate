<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Poly-Mate · 메이트 화면으로 이동</title>
    <script>
      const topic =
        new URLSearchParams(location.search).get("topic") === "health"
          ? "health"
          : "study";
      location.replace("./#/learning?topic=" + topic);
    </script>
  </head>
  <body>
    <p>
      <a href="./#/learning?topic=study">학습 메이트로 이동하기</a> ·
      <a href="./#/learning?topic=health">건강 메이트로 이동하기</a>
    </p>
  </body>
</html>
